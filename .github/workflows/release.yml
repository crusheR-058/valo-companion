# Builds the Windows installer and publishes a GitHub Release when you push a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
# The release includes latest.json, which the in-app updater reads.
# Needs repository secret TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/valo-companion.key).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KRYPTIX ${{ github.ref_name }}
          releaseBody: See the commit history for what changed.
          releaseDraft: false
          includeUpdaterJson: true
